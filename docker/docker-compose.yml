networks:
  with_run_network:
    name: with_run_network
    driver: bridge

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/jijysun/with_run_be_v2:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: withrun-app
    networks:
      - with_run_network
    # nginx가 443에서 TLS 종단 후 내부망으로만 프록시하므로 호스트에 8080을 직접 노출하지 않는다
    # (Cloudflare IP만 허용해둔 보안그룹 8080 규칙도 이제 정리 대상 — 더 이상 쓰이지 않음).
    expose:
      - "8080"
    env_file: ../.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      TZ: Asia/Seoul
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: withrun-redis
    networks:
      - with_run_network
    environment:
      TZ: Asia/Seoul
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # RDS로 대체하며 제거(2026-07-24).
  # mysql:
  #   image: mysql:8.4
  #   container_name: withrun-mysql
  #   networks:
  #     - with_run_network
  #   ports:
  #     - "3306:3306"
  #   environment:
  #     MYSQL_DATABASE: ${DB_NAME}
  #     MYSQL_USER: ${DB_USERNAME}
  #     MYSQL_PASSWORD: ${DB_PASSWORD}
  #     MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
  #     TZ: Asia/Seoul
  #   volumes:
  #     - mysql-data:/var/lib/mysql
  #   healthcheck:
  #     test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 12
  #   restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: withrun-prometheus
    networks:
      - with_run_network
    ports:
      - "9090:9090"
    environment:
      TZ: Asia/Seoul
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - app
    restart: unless-stopped

  # Cloudflare Full (Strict) 대응 — 443에서 Origin CA 인증서로 TLS 종단 후 app:8080으로 프록시.
  # 인증서/키는 레포에 넣지 않고 EC2 호스트 /etc/ssl/cloudflare를 read-only 마운트(수동 배치, DummyTalk과 공유).
  nginx:
    image: nginx:alpine
    container_name: withrun-nginx
    networks:
      - with_run_network
    ports:
      - "443:443"
    environment:
      TZ: Asia/Seoul
    volumes:
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Alpine 베이스 이미지엔 tzdata가 없어 TZ 환경변수만으론 존 이름(예: Asia/Seoul) 해석이 안 될 수 있음 —
      # 호스트(EC2, 보통 tzdata 포함)의 zoneinfo를 그대로 읽기 전용 마운트해서 우회.
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    depends_on:
      - app
    restart: unless-stopped

  # 켜고 싶을 때만 docker compose --env-file .env -f docker/docker-compose.yml --profile monitoring up -d
  grafana:
    image: grafana/grafana:latest
    container_name: withrun-grafana
    profiles: ["monitoring"]
    networks:
      - with_run_network
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: "no"


volumes:
  # mysql-data:  # RDS로 대체하며 제거
  redis-data:
  prometheus-data:
  grafana-data:
