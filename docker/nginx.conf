# Cloudflare Full (Strict) 대응 — Cloudflare Origin CA 인증서로 443에서 TLS 종단 후
# 내부 도커 네트워크(with_run_network)를 통해 app:8080으로 프록시.
# 인증서/키는 레포에 포함하지 않고 EC2 호스트의 /etc/ssl/cloudflare를 read-only 마운트해서 사용.

server {
    listen 443 ssl;
    server_name ddotg.dev;

    ssl_certificate     /etc/ssl/cloudflare/cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/key.pem;

    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;

        # STOMP/WebSocket 업그레이드 핸드셰이크 필수 헤더 — 없으면 프록시가 일반 HTTP로만 처리해서
        # WS 연결 자체가 깨진다(nginx WebSocket 프록시의 잘 알려진 함정).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # STOMP 커넥션은 오래 유지되는 연결이라 nginx 기본 타임아웃(60s)이면 유휴 중 끊길 수 있음.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
