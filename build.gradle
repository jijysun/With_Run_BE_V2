plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.3'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'UMC_8th'
version = '0.0.1-SNAPSHOT'

// /actuator/info로 배포된 이미지가 실제 어느 커밋인지 조회하기 위함.
// Dockerfile 빌드 스테이지엔 .git이 없어 로컬 git 조회가 안 되므로,
// CI(deploy.yml)가 이미 git rev-parse HEAD로 구해둔 SHA를 -PgitCommit=... 로 전달받는다.
// 로컬/gitCommit 미전달 빌드는 "unknown"으로 표시됨(정상 동작에는 영향 없음).
springBoot {
	buildInfo {
		properties {
			additional = [
				'commit.id': project.findProperty('gitCommit') ?: 'unknown'
			]
		}
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis' // redis!
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-cache' // 발신자 User/Profile 캐싱(Caffeine)
	implementation 'com.github.ben-manes.caffeine:caffeine'

	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
//	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'
//	implementation 'org.springframework.cloud:spring-cloud-starter-aws:2.2.6.RELEASE' //aws s3

	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	implementation 'jakarta.validation:jakarta.validation-api:3.0.2'

	implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0' // 버전에 따라 다름
	implementation 'com.mysql:mysql-connector-j' // MySQL 쓴다면

	compileOnly 'org.projectlombok:lombok'

	runtimeOnly 'com.mysql:mysql-connector-j'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5' // ← jackson 사용 시
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'



}

tasks.named('test') {
	useJUnitPlatform()
}
