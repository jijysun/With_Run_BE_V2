spring:
  config:
    import:
      - optional:file:.env[.properties]

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 15   # 현 RDBMS 기준 60의 25% — 여유 있게 + StompInputBoundChannel.poolSize 12개 보단 많게
      minimum-idle: 5
  sql:
    init:
      mode: never

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        # show_sql/format_sql/use_sql_comments는 Logback을 안 거치고 System.out에 직접 찍혀서
        # 레벨 조절도, 비동기 처리도 안 됨 + 포맷팅 자체 비용도 큼(부하테스트로 실측 확인, IMPROVEMENT_PLAN.md 참고).
        # 대신 chatting() 등 실제 핫패스에 원하는 포맷의 log.info를 직접 심는 방식으로 대체.
#        show_sql: true
#        format_sql: true
#        use_sql_comments: true
        hbm2ddl:
          auto: update
        default_batch_fetch_size: 1000

jwt:
  token:
    secretKey: ${JWT_SECRET_KEY}
    expiration:
      access: ${JWT_ACCESS_EXPIRATION}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: with-run

# 채팅 부하테스트 시드 러너 — 로컬 부하테스트 실행 시에만 true로 켤 것. 운영에서는 절대 활성화 금지
loadtest:
  seed:
    enabled: ${LOADTEST_SEED_ENABLED:false}
    user-count: ${LOADTEST_SEED_USER_COUNT:500}

# 채팅 관측 대시보드(FE)가 /api/observer/token 호출 시 제시해야 하는 공유 시크릿
observer:
  access-key: ${OBSERVER_ACCESS_KEY:}


  server:
    address: 0.0.0.0  # 모든 IP에서 접근 가능하게 설정

# 채팅 서비스 범위 외 — 환경변수 미설정 시에도 부팅되도록 빈 기본값 유지
cloud:
  aws:
    s3:
      bucket: ${S3_BUCKET:}
    credentials:
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
    region:
      static: ap-northeast-2
    stack:
      auto: false

google:
  places:
    key: ${GOOGLE_API_KEY:}

discord:
  webhook:
    url: ${DISCORD_WEBHOOK_URL}

chatgpt:
  api:
    uri: ${AI_API_URI:}
    key: ${AI_API_KEY:}

