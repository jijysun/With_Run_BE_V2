# =====================================================================
# 자동 배포: main 푸시 → Docker 이미지 빌드(GHCR) → EC2에 compose 배포
# ---------------------------------------------------------------------
# ★ 필요한 GitHub Secrets (Settings > Secrets and variables > Actions)
#
#   EC2_HOST            : EC2 퍼블릭 IP 또는 도메인
#   EC2_USERNAME        : SSH 접속 유저 (보통 ubuntu)
#   EC2_KEY             : SSH 접속용 PEM 키 전문 (-----BEGIN ... 포함)
#   ENV_FILE            : 운영 .env 파일 전문 (.env.example 참고해 작성)
#   DISCORD_WEBHOOK_URL : 배포 성공/실패 알림용 디스코드 웹훅 URL
#
#   GHCR(컨테이너 레지스트리) 인증은 GITHUB_TOKEN이 자동 사용되므로
#   별도 시크릿이 필요 없다.
# =====================================================================
name: Deploy to EC2 (Docker Compose)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # GHCR 이미지 이름은 소문자만 허용되므로 레포 이름을 소문자로 변환
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 운영 .env 생성 + 이번 커밋 SHA 이미지를 compose가 쓰도록 주입
      - name: Generate .env
        run: |
          printf '%s\n' "${{ secrets.ENV_FILE }}" > .env
          echo "" >> .env
          echo "APP_IMAGE=${IMAGE}:${{ github.sha }}" >> .env

      # 레포와 같은 구조(~/with_run/docker/docker-compose.yml, ~/with_run/.env)로 복사
      - name: Copy compose & .env to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          source: "docker/docker-compose.yml,.env"
          target: ~/with_run

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ~/with_run
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose --env-file .env -f docker/docker-compose.yml pull app
            docker compose --env-file .env -f docker/docker-compose.yml up -d
            docker image prune -f

      - name: Notify Discord (success)
        if: success()
        run: |
          curl -sS -H "Content-Type: application/json" \
            -d "{\"content\":\"✅ **With_Run V2 배포 성공** \`${GITHUB_SHA::7}\` — ${{ github.event.head_commit.message || 'manual run' }}\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"

      - name: Notify Discord (failure)
        if: failure()
        run: |
          curl -sS -H "Content-Type: application/json" \
            -d "{\"content\":\"❌ **With_Run V2 배포 실패** \`${GITHUB_SHA::7}\` — Actions 로그를 확인하세요: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
